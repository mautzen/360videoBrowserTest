<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>KystAR | Universal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <style>
    html, body {
      margin: 0; padding: 0; background: black;
      width: 100%; height: 100%; overflow: hidden;
      position: fixed; left: 0; top: 0;
    }
    #unity-container {
      width: 100%; height: 100%; position: relative;
      background: #000; overflow: hidden; box-sizing: border-box;
      padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #unity-canvas { background: black; display: block; width: 100%; height: 100%; }
    #custom-start-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
    }
    #btn-play {
      padding: 20px 40px; font-size: 24px; color: white;
      background: #2196F3; border: none; border-radius: 12px; cursor: pointer;
    }
    #unity-loading-bar {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); text-align: center;
    }
    #unity-progress-bar-empty { width: 200px; height: 10px; background: #333; margin-top: 10px; }
    #unity-progress-bar-full { width: 0%; height: 100%; background: white; }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="custom-start-overlay">
      <button id="btn-play">START APP</button>
      <p style="color:white; margin-top:10px; font-family: sans-serif;">Tap to begin experience</p>
    </div>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
  </div>

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const startOverlay = document.querySelector("#custom-start-overlay");
    const playButton = document.querySelector("#btn-play");

    function fillScreen() {
      const vv = window.visualViewport;
      const vh = vv ? vv.height : window.innerHeight;
      const vw = vv ? vv.width : window.innerWidth;
      container.style.height = vh + "px";
      container.style.width = vw + "px";
      window.scrollTo(0, 0);
    }

    playButton.onclick = async () => {
      startOverlay.style.display = "none";
      loadingBar.style.display = "block";

      // Fullscreen/Landscape attempt
      if (container.requestFullscreen) { try { await container.requestFullscreen(); } catch (e) {} }
      try { if (screen.orientation?.lock) { await screen.orientation.lock("landscape"); } } catch (e) {}
      
      fillScreen();

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/7a2dbded24d57e056180125b1583e7c4.loader.js";

      const config = {
        dataUrl: buildUrl + "/328c7264a5442608739c4ea73280ebe9.data",
        frameworkUrl: buildUrl + "/f12e287c5c85cf0683834fa728c7c1e2.framework.js",
        codeUrl: buildUrl + "/9e870e5953c2b941c50b35a3f63d6b5c.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VIA",
        productName: "KystAR",
        productVersion: "1.0",
        // Notice: showBanner is removed entirely here
        devicePixelRatio: Math.min(window.devicePixelRatio, 2),
      };

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (progress * 100) + "%";
        }).then(() => {
          loadingBar.style.display = "none";
          setTimeout(fillScreen, 500);
        }).catch((err) => {
          console.error(err); // Logs to browser console, but invisible to user
        });
      };
      document.body.appendChild(script);
    };

    window.addEventListener("resize", fillScreen);
    window.visualViewport?.addEventListener("resize", fillScreen);
    fillScreen();
  </script>
</body>
</html>
