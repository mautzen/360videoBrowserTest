<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | KystAR</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* Custom Start Button Styling */
        #custom-start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none; /* Hidden until game is loaded */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #btn-play {
            padding: 20px 40px;
            font-size: 24px;
            color: white;
            background: #2196F3;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

            #btn-play:active {
                background: #1976D2;
                transform: scale(0.98);
            }
    </style>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>

        <div id="custom-start-overlay">
            <button id="btn-play">START EXPERIENCE</button>
            <p style="color: white; margin-top: 15px; font-family: sans-serif;">Click to enable Gyro & Landscape</p>
        </div>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">KystAR</div>
        </div>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");
        var startOverlay = document.querySelector("#custom-start-overlay");
        var playButton = document.querySelector("#btn-play");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/b23dd96997961653e2825455633aac82.loader.js";
        var config = {
            dataUrl: buildUrl + "/6b3979998573570607988d1c38d18d58.data.unityweb",
            frameworkUrl: buildUrl + "/f12e287c5c85cf0683834fa728c7c1e2.framework.js.unityweb",
            codeUrl: buildUrl + "/9e870e5953c2b941c50b35a3f63d6b5c.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "VIA",
            productName: "KystAR",
            productVersion: "1.0",
            showBanner: unityShowBanner,
            devicePixelRatio: Math.min(window.devicePixelRatio, 2), // Fixes performance/jitter on high-res phones
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "960px";
            canvas.style.height = "540px";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";

                // Show the Start Overlay once loading is done
                startOverlay.style.display = "flex";

                playButton.onclick = () => {
                    // 1. Request Gyro Permission (Crucial for iOS/Jumpy fix)
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        DeviceOrientationEvent.requestPermission().catch(console.error);
                    }

                    // 2. Go Fullscreen
                    unityInstance.SetFullscreen(1);

                    // 3. Lock Orientation
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock("landscape").catch(e => console.log("Orientation lock not supported"));
                    }

                    // 4. Hide the button
                    startOverlay.style.display = "none";
                };

                fullscreenButton.onclick = () => {
                    unityInstance.SetFullscreen(1);
                };
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
