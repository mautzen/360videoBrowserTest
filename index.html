<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Unity WebGL Player | KystAR</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <style>
    /* Prevent the 'bounce' effect and ensure the app fills the true visible area */
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      width: 100%;
      height: 100vh;
      height: 100dvh; 
      overflow: hidden;
      position: fixed; 
      left: 0;
      top: 0;
    }

    #unity-container {
  width: 100%;
  height: 100%;
  position: relative;
  background: #000;
  overflow: hidden;
  box-sizing: border-box;
  /* Add padding to the SIDES as well as the bottom */
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  padding-bottom: env(safe-area-inset-bottom);
}

    #unity-canvas {
      background: black;
      display: block;
      width: 100%;
      height: 100%;
    }

    #custom-start-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #btn-play {
      padding: 20px 40px;
      font-size: 24px;
      color: white;
      background: #2196F3;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #btn-play:active {
      background: #1976D2;
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>

    <div id="custom-start-overlay">
      <button id="btn-play">START APP</button>
      <p style="color:white; margin-top:10px;">
        Tap to enter fullscreen & landscape
      </p>
    </div>

    <div id="unity-loading-bar" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); text-align:center;">
      <div id="unity-progress-bar-empty" style="width:200px; height:10px; background:gray; margin-top:10px;">
        <div id="unity-progress-bar-full" style="width:0%; height:100%; background:white;"></div>
      </div>
    </div>
  </div>

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const startOverlay = document.querySelector("#custom-start-overlay");
    const playButton = document.querySelector("#btn-play");

    // Most accurate height for iPad Safari
    function fillScreen() {
  // Use Visual Viewport for both width and height to be safe
  const vv = window.visualViewport;
  const vh = vv ? vv.height : window.innerHeight;
  const vw = vv ? vv.width : window.innerWidth;

  container.style.height = vh + "px";
  container.style.width = vw + "px";
  
  canvas.style.height = "100%";
  canvas.style.width = "100%";
  
  window.scrollTo(0, 0);
}

    async function goFullscreen() {
      if (container.requestFullscreen) {
        try { await container.requestFullscreen(); } catch (e) {}
      } 
      fillScreen();
    }

    async function lockLandscape() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (e) {}
    }

    playButton.onclick = async () => {
      startOverlay.style.display = "none";
      loadingBar.style.display = "block";

      await goFullscreen();
      await lockLandscape();
      fillScreen();

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/7a2dbded24d57e056180125b1583e7c4.loader.js";

      const config = {
        dataUrl: buildUrl + "/328c7264a5442608739c4ea73280ebe9.data",
        frameworkUrl: buildUrl + "/f12e287c5c85cf0683834fa728c7c1e2.framework.js",
        codeUrl: buildUrl + "/9e870e5953c2b941c50b35a3f63d6b5c.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VIA",
        productName: "KystAR",
        productVersion: "1.0",
showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio, 2),
      };

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = progress * 100 + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((err) => {
          alert(err);
        });
      };
      document.body.appendChild(script);
    };

    window.addEventListener("resize", fillScreen);
    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fillScreen);
    }
    window.addEventListener("orientationchange", () => {
      setTimeout(fillScreen, 300);
    });

    fillScreen();
  </script>
</body>
</html>
