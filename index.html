<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Unity WebGL Player | KystAR</title>

  <!-- Mobile viewport -->
  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0,
             user-scalable=no, viewport-fit=cover"
  />

  TemplateData/style.css

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    /* Start button overlay (visible immediately) */
    #custom-start-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #btn-play {
      padding: 20px 40px;
      font-size: 24px;
      color: white;
      background: #2196F3;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #btn-play:active {
      background: #1976D2;
      transform: scale(0.97);
    }

    #unity-canvas {
      background: black;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>

    <!-- Visible immediately -->
    <div id="custom-start-overlay">
      <button id="btn-play">START APP</button>
      <p style="color:white; margin-top:10px;">
        Tap to enter fullscreen & landscape
      </p>
    </div>

    <!-- Unity loading bar -->
    <div id="unity-loading-bar" style="display:none;">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">KystAR</div>
    </div>
  </div>

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const startOverlay = document.querySelector("#custom-start-overlay");
    const playButton = document.querySelector("#btn-play");

    const isIOS =
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    function fillScreen() {
      container.style.width = "100vw";
      container.style.height = "100vh";
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    async function goFullscreen() {
      try {
        await container.requestFullscreen();
      } catch (e) {}
      fillScreen(); // iOS fallback
    }

    async function lockLandscape() {
      try {
        await screen.orientation.lock("landscape");
      } catch (e) {}
    }

    /* ---- Button Click Starts Unity ---- */
    playButton.onclick = async () => {
      startOverlay.style.display = "none";
      loadingBar.style.display = "block";

      await goFullscreen();
      await lockLandscape();

      fillScreen();

      /* Begin loading Unity */
      const buildUrl = "Build";
      const loaderUrl =
        buildUrl + "/b23dd96997961653e2825455633aac82.loader.js";

      const config = {
        dataUrl:
          buildUrl + "/6b3979998573570607988d1c38d18d58.data.unityweb",
        frameworkUrl:
          buildUrl + "/f12e287c5c85cf0683834fa728c7c1e2.framework.js.unityweb",
        codeUrl:
          buildUrl + "/9e870e5953c2b941c50b35a3f63d6b5c.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VIA",
        productName: "KystAR",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio, 2),
      };

      const script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = progress * 100 + "%";
        });
      };

      document.body.appendChild(script);
    };

    window.addEventListener("resize", fillScreen);
    window.addEventListener("orientationchange", () => {
      setTimeout(fillScreen, 200);
    });
  </script>

</body>
</html>
